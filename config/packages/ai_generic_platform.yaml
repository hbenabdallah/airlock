# Any provider that speaks the OpenAI chat completions API with structured output: the generic platform calls it.
ai:
    platform:
        generic:
            models:
                base_url: '%env(AIRLOCK_AI_BASE_URL)%'
                api_key: '%env(AIRLOCK_AI_API_KEY)%'
                http_client: 'models.client'
                supports_embeddings: false

# A model that does not answer in time is no answer: the command's result never waits long for it.
framework:
    http_client:
        scoped_clients:
            models.client:
                base_uri: '%env(AIRLOCK_AI_BASE_URL)%'
                timeout: '%env(float:AIRLOCK_AI_TIMEOUT)%'
                max_duration: '%env(float:AIRLOCK_AI_TIMEOUT)%'
