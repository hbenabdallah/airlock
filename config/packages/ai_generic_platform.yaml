# The chat completions API the model checks ask, set in the environment: the generic platform calls it.
ai:
    platform:
        generic:
            models:
                base_url: '%env(model_setting:AIRLOCK_AI_BASE_URL)%'
                api_key: '%env(model_setting:AIRLOCK_AI_API_KEY)%'
                http_client: 'models.client'
                supports_embeddings: false

# A model that does not answer in time is no answer: the command's result never waits long for it.
framework:
    http_client:
        scoped_clients:
            models.client:
                scope: '.*'
                timeout: '%env(float:AIRLOCK_AI_TIMEOUT)%'
                max_duration: '%env(float:AIRLOCK_AI_TIMEOUT)%'
