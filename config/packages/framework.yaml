# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        # The server the tests start never calls a model: recorded answers stand in for NVIDIA's API.
        http_client:
            mock_response_factory: App\Tests\Output\RecordedNvidiaApi
        session:
            storage_factory_id: session.storage.factory.mock_file
